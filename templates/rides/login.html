{% extends 'rides/base.html' %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 p-4" style="border-radius: 16px;">
                <h3 class="fw-bold mb-3 text-center" style="color: var(--gt-primary);">Вход в профила</h3>
                <p class="text-muted text-center mb-4">Въведи данните си, за да продължиш.</p>

                <form method="POST">
                    {% csrf_token %}

                    {% if form.errors %}
                        <div class="alert alert-danger py-2 small">
                            Грешно потребителско име или парола.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Потребителско име</label>
                        <input type="text" name="username" class="form-control form-control-gt" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-secondary">Парола</label>
                        <input type="password" name="password" class="form-control form-control-gt" required>
                    </div>

                    <button type="submit" class="btn btn-gt-primary w-100 py-2">Влез</button>
                    <div class="text-center mt-3">
                        <span class="small text-muted">Нямаш профил?</span>
                        <a href="{% url 'register' %}" class="small fw-bold" style="color: var(--gt-accent);">Регистрирай
                            се</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
