{% load static %}
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTogether — Споделени пътувания</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'rides/css/style.css' %}">
</head>
<body>

<nav class="navbar-custom mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="{% url 'home' %}" class="brand-logo">GoTogether<span class="dot">.</span></a>
        <div class="d-flex align-items-center">
            <a href="{% url 'create_ride' %}" class="btn btn-gt-accent me-3">+ Пусни пътуване</a>

            {% if user.is_authenticated %}
                <span class="fw-semibold text-dark me-3">Здравей, {{ user.username }}</span>
                <!-- В Django 5+ изходът се прави чрез POST заявка за сигурност -->
                <form method="POST" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-gt-outline btn-sm">Изход</button>
                </form>
            {% else %}
                <a href="{% url 'register' %}" class="btn btn-gt-primary btn-sm">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
